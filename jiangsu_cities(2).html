// ============ Tab 逻辑 ============
const DATASETS = {
  js:   { name: "江苏省",   p: [...P.jiangsu],                                        c: [...C.jiangsu] },
  jzhw: { name: "江浙沪皖鲁", p: [...P.jiangsu, ...P.zhejiang, ...P.shanghai, ...P.anhui, ...P.shandong],
          c: [...C.jiangsu, ...C.zhejiang, ...C.anhui, ...C.shandong] },
  all:  { name: "全国",     p: [...P.jiangsu, ...P.zhejiang, ...P.shanghai, ...P.anhui, ...P.shandong, ...P.other],
          c: [...C.jiangsu, ...C.zhejiang, ...C.anhui, ...C.shandong, ...C.other] }
};

// 打标签
Object.values(DATASETS).forEach(ds => {
  ds.p.forEach(x => x.level = 'p');
  ds.c.forEach(x => x.level = 'c');
});

let currentTab = 'js';
let currentScope = 'all';
let lastIndex = -1;

const display = document.getElementById('display');
const poolInfo = document.getElementById('poolInfo');
const drawBtn = document.getElementById('draw');
const scopeBox = document.getElementById('scope');
const tabbar = document.getElementById('tabbar');

function currentPool() {
  const ds = DATASETS[currentTab];
  if (currentScope === 'p') return ds.p;
  if (currentScope === 'c') return ds.c;
  return [...ds.p, ...ds.c];
}

function updatePoolInfo() {
  const ds = DATASETS[currentTab];
  const pool = currentPool();
  poolInfo.textContent = `当前：${ds.name} · 抽中池 ${pool.length} 座城市（地级 ${ds.p.length} · 县级 ${ds.c.length}）`;
}

function resetState() {
  lastIndex = -1;
  updatePoolInfo();
}

tabbar.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  tabbar.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el === t));
  currentTab = t.dataset.tab;
  resetState();
  display.innerHTML = '<div class="placeholder">点击「开始抽取」试试 →</div>';
});

scopeBox.addEventListener('click', e => {
  const btn = e.target.closest('button[data-scope]');
  if (!btn) return;
  currentScope = btn.dataset.scope;
  scopeBox.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  resetState();
});

drawBtn.addEventListener('click', () => {
  const pool = currentPool();
  if (pool.length === 0) return;
  let idx;
  do {
    idx = Math.floor(Math.random() * pool.length);
  } while (idx === lastIndex && pool.length > 1);
  lastIndex = idx;
  spinThenRender(pool, pool[idx]);
});

let spinTimer = null;
function spinThenRender(pool, finalCity) {
  drawBtn.disabled = true;
  drawBtn.classList.add('spinning');
  drawBtn.textContent = '抽取中';
  display.classList.remove('pop');
  display.innerHTML = `
    <div class="rolling">
      <div class="tip">抽取中</div>
      <div class="name" id="spinName">${escapeHtml(pool[0].name)}</div>
      <div class="dots"><span>●</span><span>●</span><span>●</span></div>
    </div>`;
  const nameEl = document.getElementById('spinName');

  const totalMs = 1400;
  const start = performance.now();
  function tick() {
    const elapsed = performance.now() - start;
    if (elapsed >= totalMs) {
      nameEl.textContent = finalCity.name;
      showFinal(finalCity);
      return;
    }
    // 缓动：越到后面切换越慢
    const progress = elapsed / totalMs;
    const interval = 60 + Math.pow(progress, 3) * 340; // 60ms → 400ms
    const rand = pool[Math.floor(Math.random() * pool.length)].name;
    nameEl.textContent = rand;
    spinTimer = setTimeout(tick, interval);
  }
  tick();
}

function showFinal(city) {
  drawBtn.disabled = false;
  drawBtn.classList.remove('spinning');
  drawBtn.textContent = '开始抽取';
  render(city);
  const title = display.querySelector('.city-title');
  if (title) title.classList.add('final-pulse');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(city) {
  display.classList.remove('pop');
  void display.offsetWidth;
  const levelLabel = city.level === 'c' ? '县级市' : '地级市';
  const provBadge = city.province ? `<span class="badge province">${escapeHtml(city.province)}</span>` : '';
  display.innerHTML = `
    <div class="city-title">
      ${escapeHtml(city.name)}
      <span class="badge">${escapeHtml(city.tag)}</span>
      ${provBadge}
      <span class="badge level-${city.level}">${levelLabel}</span>
    </div>
    <div class="section">
      <h3>知名景点</h3>
      <div class="cards">
        ${city.spots.map(s => `<div class="card spot"><div class="name">${escapeHtml(s.n)}</div><div class="desc">${escapeHtml(s.d)}</div></div>`).join('')}
      </div>
    </div>
    <div class="section">
      <h3>特色美食</h3>
      <div class="cards">
        ${city.foods.map(f => `<div class="card food"><div class="name">${escapeHtml(f.n)}</div><div class="desc">${escapeHtml(f.d)}</div></div>`).join('')}
      </div>
    </div>
  `;
  display.classList.add('pop');
}

resetState();
</script>
</body>
</html>
